name: Recover dead members from the Kaggle CRSP dump (validated first)

on:
  workflow_dispatch:
    inputs:
      specs: { description: "LABEL=PERMNO@START:END ... (space-separated; permnos from probe_crsp.yml; \"-\" = validate only)", required: true }
      checks: { description: "Dead labels we already hold, to validate CRSP against (space-separated)", required: false, default: "NYX-201311 DELL-201310 HNZ-201306 CVH-201305 BEAM-201404 FRX-201406 IGT-201504 CB-201601 TWX-201806 BCR-201712 COV-201501 SNDK-201605 EMC-201609 PCP-201601 AET-201811" }
      slug: { description: "Kaggle dataset", required: false, default: "meliodaz/crsp-with-mkt-ret-68-24" }
      check_year: { description: "List every check-label disagreement in this year (blank = none)", required: false, default: "" }
      show_rows: { description: "Print CRSP rows: PERMNO:START:END ... (read-only)", required: false, default: "" }

permissions:
  contents: write

concurrency:
  group: raw-store          # never run alongside another job that rewrites raw.tar.zst
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow 'kaggle>=1.8.0'
      - name: Restore the raw store
        run: |
          gh release download data --pattern 'raw.tar.zst' --dir . --clobber
          tar --zstd -xf raw.tar.zst
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: mkdir -p kag && kaggle datasets download -d "${{ github.event.inputs.slug }}" -p kag --unzip && du -sh kag
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
      - run: python fetch_crsp.py "${{ github.event.inputs.specs }}" "${{ github.event.inputs.checks }}"
        env: { CHECK_YEAR: "${{ github.event.inputs.check_year }}", SHOW_ROWS: "${{ github.event.inputs.show_rows }}" }
      - name: Publish the report
        if: always()
        run: '[ -f data/crsp_fetch_report.txt ] && gh release upload data data/crsp_fetch_report.txt --clobber || true'
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Publish the raw store (only after a clean restore and run)
        run: |
          n=$(ls data/raw/*.parquet | wc -l); echo "$n raw files"; [ "$n" -gt 900 ] || { echo "raw store looks incomplete - not publishing"; exit 1; }
          tar --zstd -cf raw.tar.zst data/raw
          gh release upload data raw.tar.zst --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
