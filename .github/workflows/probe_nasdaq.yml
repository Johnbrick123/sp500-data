name: Probe Nasdaq history vs ours for one ticker
on:
  workflow_dispatch:
    inputs:
      ticker: { description: "Ticker", required: true, default: "CRH" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow
      - run: mkdir -p data && gh release download data --pattern 'prices.parquet' --dir data --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python probe_nasdaq.py "${{ github.event.inputs.ticker }}"
