name: Recover missing members via permaTicker (name match)

on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Hourly batches to run (45 names each)"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: raw-store          # never run alongside another job that rewrites raw.tar.zst
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow
      - name: Restore current dataset
        run: |
          mkdir -p data/universe
          gh release download data --pattern 'raw.tar.zst' --dir . --clobber
          tar --zstd -xf raw.tar.zst
          gh release download data --pattern 'membership_intervals.parquet' --dir data/universe --clobber
          gh release download data --pattern 'perma_names_progress.json' --dir data || true
          gh release download data --pattern 'relabels.csv' --dir data || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python fetch_perma_names.py
        env:
          TIINGO_API_KEY: "${{ secrets.TIINGO_API_KEY }}"
          NASDAQ_DATA_LINK_KEY: "${{ secrets.NASDAQ_DATA_LINK_KEY }}"
          PERMA_BATCHES: "${{ github.event.inputs.batches || '4' }}"
      - name: Publish recovered files, progress, relabels and the report
        if: always()
        run: |
          up() { for i in 1 2 3 4 5 6; do gh release upload data "$1" --clobber && return 0; echo "upload $1 failed (try $i)"; sleep $((i*30)); done; return 1; }
          for f in data/perma_names_report.txt data/perma_names_progress.json data/relabels.csv; do
            [ -f "$f" ] && up "$f" || true
          done
          tar --zstd -cf raw.tar.zst data/raw
          up raw.tar.zst
        env: { GH_TOKEN: "${{ github.token }}" }
