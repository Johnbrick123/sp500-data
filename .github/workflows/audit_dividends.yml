name: Audit dividends against Tiingo
on:
  workflow_dispatch:
    inputs:
      years: { description: "Year or range, e.g. 2018 or 2018-2026", required: true, default: "2018-2026" }
      tickers: { description: "Names to check first (comma list)", required: false, default: "" }
      all: { description: "Then every other Yahoo-sourced member of the range (yes/no)", required: false, default: "no" }
      parts: { description: "Hourly parts of 40 names (one Tiingo request each)", required: false, default: "1" }
      first_part: { description: "Start at this part (to resume)", required: false, default: "1" }
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow
      - run: |
          mkdir -p data/universe
          gh release download data --pattern 'prices.parquet' --dir data --clobber
          gh release download data --pattern 'membership_intervals.parquet' --dir data/universe --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Run the parts, an hour apart (Tiingo free tier - 50 requests an hour)
        run: |
          ALL=""; [ "${{ github.event.inputs.all }}" = "yes" ] && ALL="--all"
          first=${{ github.event.inputs.first_part }}; last=$(( first + ${{ github.event.inputs.parts }} - 1 ))
          for part in $(seq $first $last); do
            DIV_OFFSET=$(( (part - 1) * 40 )) DIV_LIMIT=40 DIV_PART=$part \
              python audit_dividends.py "${{ github.event.inputs.years }}" "${{ github.event.inputs.tickers }}" $ALL || true
            tag="${{ github.event.inputs.years }}_part$part"
            gh release upload data "data/dividend_audit_${tag}.txt" "data/dividend_audit_${tag}_overrides.csv" --clobber || true
            grep -q "0 names (offset" "data/dividend_audit_${tag}.txt" && break
            [ $part -lt $last ] && sleep 3610
          done
        env:
          TIINGO_API_KEY: "${{ secrets.TIINGO_API_KEY }}"
          GH_TOKEN: "${{ github.token }}"
