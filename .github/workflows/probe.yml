name: Probe Nasdaq Data Link access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python probe_tiingo.py
        continue-on-error: true
        env: { TIINGO_API_KEY: "${{ secrets.TIINGO_API_KEY }}" }
      - if: always()
        run: gh release upload data data/tiingo_perma_probe.txt --clobber || true
        env: { GH_TOKEN: "${{ github.token }}" }
