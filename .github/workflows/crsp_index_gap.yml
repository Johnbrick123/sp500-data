name: Find a member missing from the membership file (S&P 500 index residual vs the CRSP dump)
on:
  workflow_dispatch:
    inputs:
      resid: { description: "YYYY-MM-DD=bp ... (published index return minus the one rebuilt from our members)", required: true }
      spx: { description: "YYYY-MM-DD=ret ... (the published index's daily returns, same days)", required: true }
      total_mcap: { description: "The index's total market cap, $M", required: false, default: "8000000" }
      top: { description: "Candidates to print", required: false, default: "30" }
      slug: { description: "Kaggle dataset", required: false, default: "meliodaz/crsp-with-mkt-ret-68-24" }
permissions:
  contents: write
jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas numpy 'kaggle>=1.8.0'
      - run: mkdir -p kag && kaggle datasets download -d "${{ github.event.inputs.slug }}" -p kag --unzip && du -sh kag
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
      - run: python tools/crsp_index_gap.py
        env:
          RESID: "${{ github.event.inputs.resid }}"
          SPX: "${{ github.event.inputs.spx }}"
          TOTAL_MCAP: "${{ github.event.inputs.total_mcap }}"
          TOP: "${{ github.event.inputs.top }}"
      - run: gh release upload data data/crsp_index_gap.txt --clobber
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
