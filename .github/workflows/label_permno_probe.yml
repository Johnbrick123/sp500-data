name: Best CRSP permno for some label-years (read-only)
on:
  workflow_dispatch:
    inputs:
      pairs: { description: "LABEL:YEAR ...", required: true }
      slug: { description: "Kaggle dataset", required: false, default: "meliodaz/crsp-with-mkt-ret-68-24" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow 'kaggle>=1.8.0'
      - run: mkdir -p kag && kaggle datasets download -d "${{ github.event.inputs.slug }}" -p kag --unzip
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
      - run: gh release download data --pattern prices.parquet --pattern membership_intervals.parquet --dir rel --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python tools/label_permno_probe.py rel/prices.parquet rel/membership_intervals.parquet ${{ github.event.inputs.pairs }} | tee label_permno_probe.txt
      - run: gh release upload data label_permno_probe.txt --clobber
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
