name: Recover reused-ticker companies via permaTicker

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated labels to (re)try, e.g. S-202004,STI-201912 (blank = all missing)"
        required: false
        default: ""
      batches:
        description: "Hourly batches to run (45 names each)"
        required: false
        default: "4"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # up to 4 batches with an hour's wait between them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas pyarrow
      - name: Restore current dataset
        run: |
          mkdir -p data/universe
          gh release download data --pattern 'raw.tar.zst' --dir . --clobber
          tar --zstd -xf raw.tar.zst
          gh release download data --pattern 'membership_intervals.parquet' --dir data/universe --clobber
          gh release download data --pattern 'perma_progress.json' --dir data || true
          gh release download data --pattern 'relabels.csv' --dir data || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python fetch_perma.py
        env:
          TIINGO_API_KEY: "${{ secrets.TIINGO_API_KEY }}"
          PERMA_BATCHES: "${{ github.event.inputs.batches || '4' }}"
          PERMA_ONLY: "${{ github.event.inputs.only }}"
      - name: Publish recovered files, progress, relabels and the report
        if: always()
        run: |
          # GitHub's release API returned HTTP 500 on 2026-10-07 and a full
          # 4-hour sweep was lost, so every upload retries with backoff.
          up() { for i in 1 2 3 4 5 6; do gh release upload data "$1" --clobber && return 0; echo "upload $1 failed (try $i)"; sleep $((i*30)); done; return 1; }
          for f in data/perma_report.txt data/perma_progress.json data/relabels.csv; do
            [ -f "$f" ] && up "$f" || true
          done
          tar --zstd -cf raw.tar.zst data/raw
          up raw.tar.zst
        env: { GH_TOKEN: "${{ github.token }}" }
