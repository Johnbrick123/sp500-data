name: Hourly delisted-name recovery (Tiingo)

on:
  # Hourly schedule retired 2026-10-08: the ticker-based sweep is exhausted (every
  # remaining name is covered by the permaTicker sweep in perma.yml) and its
  # raw.tar.zst upload could race a perma run. Manual dispatch still works.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-store          # never run alongside another job that rewrites raw.tar.zst
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # 4 batches with an hour's wait between them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas pyarrow beautifulsoup4 lxml
      - name: Restore current raw data and progress
        run: |
          gh release download data --pattern 'raw.tar.zst' --dir . || true
          [ -f raw.tar.zst ] && tar --zstd -xf raw.tar.zst || true
          gh release download data --pattern 'tiingo_progress.json' --dir data || true
          gh release download data --pattern 'membership_intervals.parquet' --dir data/universe || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: python fetch_delisted_tiingo.py
        env:
          TIINGO_API_KEY: "${{ secrets.TIINGO_API_KEY }}"
          TIINGO_BATCHES: "4"
      - name: Save progress and any recovered files
        run: |
          tar --zstd -cf raw.tar.zst data/raw
          gh release upload data raw.tar.zst data/tiingo_progress.json --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
