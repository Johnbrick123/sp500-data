name: Identity audit of the CRSP permnos we use (read-only)
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Kaggle dataset", required: false, default: "meliodaz/crsp-with-mkt-ret-68-24" }
      pairs: { description: "Optional label,permno CSV in the repo to audit instead of crsp_permnos.csv (its report goes to crsp_identity_<file stem>.csv)", required: false, default: "" }
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas 'kaggle>=1.8.0'
      - run: mkdir -p kag && kaggle datasets download -d "${{ github.event.inputs.slug }}" -p kag --unzip && du -sh kag
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
      - run: python tools/crsp_identity_audit.py "${{ github.event.inputs.pairs || 'crsp_permnos.csv' }}"
      - name: Name the report after a custom list
        if: ${{ github.event.inputs.pairs != '' }}
        run: mv data/crsp_identity.csv "data/crsp_identity_$(basename '${{ github.event.inputs.pairs }}' .csv).csv"
      - run: gh release upload data data/crsp_identity*.csv --clobber
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
